         non-JS fetchers (many AI/link-preview bots) see identical facts,
         including the WebSite → Person (developer) relationship, without
         needing to render the app. This is structured metadata only — it
         renders no visible text and changes nothing in the UI. -->

    <!-- Favicons -->
    <!-- Google shows site icons at 48px+ (multiples of 48). Only 16/32px were
         declared before, so Google enlarged a tiny image and it looked blurry.
         ?v=5 forces browsers/Google to drop the old cached icon. -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=5" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFDF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1F14" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- RSS Feed — discoverable by browsers and feed readers -->

    <!-- Self-hosted fonts: preloaded so headings/body paint in the right face immediately -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <!-- PERF: Cloudinary serves the school logo/banner/principal photos.
         Upgrading from dns-prefetch to preconnect establishes TCP+TLS
         early, saving ~100-200ms on the first image byte — directly
         improves LCP, which is dominated by the hero image paint. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- ─────────────────────────────────────────────────────────────────────
         WEB FONTS — loaded here, non-render-blocking, NOT from index.css
         ─────────────────────────────────────────────────────────────────────
         This request used to be a CSS @import at the top of index.css, which
         made it a serial, render-blocking step: download CSS → parse → fetch
         the Google Fonts CSS → THEN paint. On a slow or restricted mobile
         connection that chain left users staring at a blank page for many
         seconds, which is the "stuck / hanging" feeling this fixes.

         `media="print"` makes the browser treat this stylesheet as
         low-priority and non-render-blocking; the onload handler then flips it
         to `all` once it has actually arrived. The page therefore paints
         immediately in the system font stack (declared in the critical inline
         CSS below) and upgrades to the web fonts whenever they load.
         display=swap means text is NEVER invisible waiting on a font.

         If fonts.googleapis.com is slow or unreachable — common on some
         Pakistani mobile networks — nothing hangs and nothing breaks: the site
         simply stays on the system fonts. That is exactly the behaviour we
         want, and it is impossible with a CSS @import.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400..900&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400..900&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
      />
    </noscript>

    <!-- PLAUSIBLE_INJECT_PLACEHOLDER - Analytics with SRI for integrity -->

    <!-- Fonts are loaded via @import in src/index.css with display=swap -->

    <!-- Inline critical CSS -->
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        background: hsl(90, 60%, 98%);
      }
      #root { min-height: 100vh; }
    </style>

    <!-- Theme bootstrap — prevents flash of wrong theme.
         The site ships TWO appearances: System (follows device) and Dark.
         Legacy saved values (light / midnight / forest / violet / lantern)
         resolve to System, except midnight and lantern which were dark and
         stay dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ghs-theme');
          var root = document.documentElement;
          root.classList.remove('dark','theme-midnight','theme-forest','theme-violet','theme-lantern');
          if (t === 'dark' || t === 'midnight' || t === 'lantern') {
            root.classList.add('dark');
          } else {
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- LCP image preload — progressive enhancement.
         The school logo (the page's Largest Contentful Paint element on most
         routes) is a Cloudinary URL fetched from Supabase at runtime, so a
         static <link rel="preload"> can't be hard-coded here. However, the app
         persists the last-known school settings (including logo_url) to
         localStorage under 'ghs-school-settings-v1'. Reading that synchronously
         in the head lets the browser start fetching the logo BEFORE React
         mounts and before the Supabase round-trip completes — directly
         improving LCP. If nothing is cached (first visit), this is a no-op
         and the logo loads normally once React mounts. The Cloudinary delivery
         transforms (f_auto,q_auto,w_96) match what the Navbar renders so the
         preloaded bytes are the exact same image the <img> will use. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ghs-school-settings-v1');
          if (!raw) return;
          var s = JSON.parse(raw);
          var logo = s && s.logo_url;
          if (!logo || typeof logo !== 'string') return;
          if (logo.indexOf('res.cloudinary.com') === -1 || logo.indexOf('/upload/') === -1) return;
          // Don't double-insert transforms if the URL already has them.
          if (/\/upload\/(f_auto|q_auto|w_\d+)/i.test(logo)) return;
          var optimized = logo.replace('/upload/', '/upload/f_auto,q_auto,w_96/');
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = optimized;
          link.fetchpriority = 'high';
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
